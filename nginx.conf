events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # OCR/anexos em base64 podem passar do limite padrão do backend.
        client_max_body_size 20m;

        # Segurança (P6): headers de segurança no nível do proxy.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://images.unsplash.com; font-src 'self'; connect-src 'self' https://api.opencnpj.org https://brasilapi.com.br; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        location /api/ {
            proxy_pass http://backend:3333;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://backend:3333/health;
            proxy_set_header Host $host;
        }

        # SPA: qualquer rota que não seja arquivo estático cai no index.html
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
