version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nex_postgres
    restart: always
    environment:
      POSTGRES_DB: nex_erp
      POSTGRES_USER: nex_user
      POSTGRES_PASSWORD: nex_secure_pass_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  redis:
    image: redis:7-alpine
    container_name: nex_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nex_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://nex_user:nex_secure_pass_2026@postgres:5432/nex_erp
      REDIS_URL: redis://redis:6379
      JWT_SECRET: nex-erp-secure-jwt-secret-key-2026
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:alpine
    container_name: nex_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

volumes:
  postgres_data:
  redis_data:
