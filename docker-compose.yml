services:
  postgres:
    image: postgres:16-alpine
    container_name: nex_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nex_erp}
      POSTGRES_USER: ${POSTGRES_USER:-nex_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
    # Porta não publicada no host: só os containers da mesma rede (app) precisam acessar o Postgres.
    # Se quiser conectar um cliente (ex: DBeaver) direto do seu computador, descomente as linhas abaixo
    # e restrinja no firewall (ufw) o IP de origem permitido.
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  redis:
    image: redis:7-alpine
    container_name: nex_redis
    restart: always
    # Idem: Redis só precisa ser alcançado pelo container "app" na rede interna do Compose.
    # ports:
    #   - "6379:6379"
    volumes:
      - redis_data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nex_app
    restart: always
    # Não publica a porta 3000 no host: todo o tráfego externo passa pelo nginx (80/443),
    # que já enxerga o app pela rede interna do Compose (proxy_pass http://app:3000).
    # ports:
    #   - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-nex_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nex_erp}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no arquivo .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:alpine
    container_name: nex_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

volumes:
  postgres_data:
  redis_data:
